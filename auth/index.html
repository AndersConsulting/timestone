<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Security-Policy" content="__CSP__">
    <meta name="theme-color" content="#080f12">
    <title>Timestone · ANDERS Consulting</title>
    <link rel="icon" type="image/svg+xml" href="/assets/mark.svg">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="page-frame">
      <header class="masthead">
        <a class="wordmark" href="/" aria-label="ANDERS Consulting · Timestone Startseite">
          <span class="wordmark-name">A<span class="brand-n">N</span>DERS</span>
          <span class="wordmark-subtitle">CONSULTING</span>
        </a>
      </header>
      <main class="workspace">
        <div class="story" aria-hidden="true">
          <div class="stone-scene">
            <div class="stone-aura"></div>
            <img class="stone-art" src="/assets/time-stone.svg" alt="" width="620" height="440">
          </div>
        </div>
        <section class="access-area" aria-label="Dein Timestone-Zugang">
          <div class="card">
            <div class="card-topline"><span class="card-symbol" aria-hidden="true">◈</span><span>TIMESTONE</span></div>
            <section id="content" aria-live="polite"><p class="status">Verbindung wird geladen …</p></section>
            <noscript>Bitte aktiviere JavaScript, um dich anzumelden.</noscript>
          </div>
        </section>
      </main>
      <footer class="page-footer">Brought to you by AC Tech</footer>
    </div>
  </body>
</html>
